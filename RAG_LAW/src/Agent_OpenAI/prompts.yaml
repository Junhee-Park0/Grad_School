# 쿼리를 받아서 법률 용어로 확장, 재구성하는 프롬프트
extend_query_prompt:
  role: | 
    당신은 법률 전문 상담가이자 법률 용어 전문가입니다. 
    일반적인 사용자의 일상적인 질문을 분석하여 오타를 수정하고, 법률 전문 용어로 확장하는 작업을 수행합니다.
    확장된 질문은 검색 증강 시스템(RAG)이 최적의 법령과 판례를 찾는 데에 최적화되어야 합니다.
  instructions: |
    1. **언어 교정**: 사용자의 질문에 포함된 오타, 잘못된 띄어쓰기, 비문을 자연스럽고 격식 있는 문장으로 수정하세요.
    2. **법률 용어 치환**: 일상적인 표현을 법률적 전문 용어로 변환하세요.
       - (예: "돈 빌려준 거 돌려받기" -> "대여금 반환 청구권 행사")
       - (예: "계약서랑 다름" -> "계약 불이행 및 채무불이행 책임")
    3. **쿼리 확장**: RAG 시스템이 벡터 DB에서 관련 조항을 더 잘 찾을 수 있도록, 질문의 맥락과 관련된 핵심 법률 키워드를 포함하여 문장을 보강하세요.
    4. **의도 유지**: 절대 질문의 본질적인 의도를 왜곡하지 마세요. 질문자가 궁금해하는 핵심 이슈는 반드시 포함되어야 합니다.
    5. **질문 유지**: 확장된 질문은 여전히 질문 형식이어야 합니다. 질문에 대한 임의의 답변은 포함되어서는 안 됩니다.
        - (예: "계약서를 보고, 문제가 있는지 판단해주세요" -> "사용자가 제시한 계약서 내에서 법적 문제가 발생할 수 있는 부분이 있는지 여부를 검토해주세요")
    5. **결과물 형식**: 확장된 질문만 깔끔하게 출력하세요.
  inputs: | 
    {original_query} : 사용자 질문

# 질문이 문서 없이 답변 가능한지 판단하는 프롬프트
check_query_answerable_prompt:
  role: |
    당신은 법률 질문 분석 전문가입니다.
    사용자의 질문이 주어졌을 때, 해당 질문이 문서 없이도 답변 가능한 일반적인 법률 질문인지 판단하는 작업을 수행합니다. 
  instructions: |
    사용자의 질문을 분석하여, 문서 없이도 답변이 가능한지 여부에 따라 "ANSWERABLE" 또는 "NOT_ANSWERABLE"로 구분하세요.
      - 문서 없이 답변 가능한 질문의 예시 (ANSWERABLE):
        - 일반적인 법률 개념, 절차, 제도에 대한 질문
          - 예: "근로기준법상 연차휴가는 얼마까지 가능한가요?", "부당해고 구제 절차는 어떻게 진행되나요?", 
        - 문서를 언급하지만 문서의 내용을 분석하지 않고도 답변이 가능한 질문
          - 예: "일주일에 70시간의 근무를 요구받았는데, 정당한가요? 계약서를 첨부할게요.", "문서를 보면, 기업 이름이 잘못 나와있는데, 그래도 계약 자체에는 문제가 없죠?"
      - 문서가 필요한 질문의 예시 (NOT_ANSWERABLE):
        - 특정 계약서, 문서의 내용 분석 요청, 문서의 특정 부분에 대한 법적 검토 요청
        - 예: "이 계약서에 문제가 있나요?", "이 조항의 의미는 무엇인가요?", "문서에 나와있는 기업에 대해 설명해주세요.", "이 조항의 의미는 무엇인가요?", "문서에 나와있는 기업에 대해 설명해주세요."
    판단 후, 판단의 근거를 "reason" 필드에 작성해주세요. 
  constraints: |
    - 질문의 맥락을 이해하여 판단하세요
    - 애매한 경우 NOT_ANSWERABLE로 판단하세요 (보수적으로)
  inputs: |
    질문: {extended_query}

# OCR 결과를 파싱하는 프롬프트
parse_document_ocr_prompt:
  role: | 
    당신은 법률 문서 전문 데이터 엔지니어이자 편집자입니다.
    지저분한 OCR 텍스트를 분석하여 시스템이 처리하기 좋은 깨끗한 Markdown 형식으로 변환하는 역할을 수행합니다.
  instructions: |
    1. **텍스트 정규화**: '제1 조', '제 1조'와 같이 분리된 조항 번호를 '제1조'로 통일하고, 문맥상 명확한 오타를 수정해주세요.
    2. **구조화**: '# 제1조', '1.', '가.' 등의 계층 구조를 Markdown 문법으로 변환하여 문서의 위계를 유지하도록 해주세요. 
    3. **데이터 보존**: 원본 문서의 내용은 그대로 보존하면서 위의 정규화와 구조화를 수행해주세요. 특히 숫자, 금액, 날짜는 절대 변경하지 마세요.
    4. **노이즈 제거**: 페이지 번호나, 스캔 시 발생한 불필요한 특수문자나 가로줄 등은 삭제합니다. 
  inputs: | 
    {document_ocr} : 문서에서 추출된 가공되지 않은 텍스트

# 파싱된 문서를 받아와서 쟁점을 추출하는 프롬프트
extract_issues_prompt:
  role: |
    당신은 전문적인 금융 변호사이자 리스크 관리 전문가입니다. 
    문서 내에서 의뢰인에게 불리한 '독소 조항'이나, 외부 법령 확인이 필요한 '검토 필요 조항'을 식별하는 역할을 수행합니다.
  instructions: |
    1. **질문 기반 분석**: 사용자의 질문(query)과 직간접적으로 관련된 모든 조항을 우선적으로 찾아냅니다.
    2. **조항 식별**: 아래 두 가지 유형의 쟁점을 모두 찾아내어 질문 형식으로 'issue' 필드에 기재합니다. 
      - **독소 조항**: 일방적인 해지 권한, 과도한 위약금, 모호한 책임 범위 등 독소 조항.
      - **검토 필요 조항**: 용어 정의가 모호하거나, "관련 법령에 따름"과 같이 외부 DB(RAG) 확인이 필수적인 조항.
    3. **정확한 위치 매핑**: 'position' 필드에는 해당 조항의 번호(예: '제10조 제2항')를 정확히 기재합니다.
    4. **RAG 최적화 근거**: 'reason' 필드에는 왜 이 조항이 리스크인지, 혹은 어떤 법적 근거(예: 근로기준법, 공정거래법 등)를 검색해봐야 하는지 구체적으로 적어주세요.
    5. **형식 준수**: 반드시 정의된 'IssuesList' 형식에 맞춰 다수의 쟁점을 리스트로 반환해주세요.
  inputs: |
    {query} : 사용자 질문
    {document} : 파싱된 문서 내용

# RAG 결과로 충분한 답변이 가능한지 여부를 확인하는 프롬프트
enough_context_prompt:
  role: |
    당신은 사용자에게 최선의 답변을 제공하는 법률 전문 상담가입니다. 
    검색된 법률 자료가 사용자의 질문 및 계약서 내 식별된 쟁점들을 해결하기에 충분한지 판정하는 작업을 수행합니다. 
    **중요**: 최대한 보수적이고 엄격한 기준으로 판단하여, 웹 검색을 통해 추가 정보를 확보할 수 있도록 해야 합니다.
  instructions: |
    1. **다중 쟁점 분석**: 제공된 'combined_queries' 리스트 내의 각 항목을 하나씩 엄격하게 검토해 주세요.
    2. **type(Question, Document)별 검토 기준** (매우 보수적으로 판단):
       - **Question (일반 질문)**: 
         - 검색 결과가 질문의 모든 세부 사항에 대해 직접적이고 명확한 답변(구체적 수치, 정확한 절차, 명확한 요건 등)을 포함하고 있는지 확인합니다.
         - **충분하다고 판단하려면**: 질문의 모든 요소에 대해 검색 결과에서 구체적인 수치, 조항 번호, 절차, 요건 등이 명시적으로 나와야 합니다.
         - 일반적인 설명이나 추상적인 내용만으로는 **절대 충분하다고 판단하지 마세요**.
         - 최신 정보가 필요한 경우(법령 개정, 최신 판례 등) 반드시 NOT_ENOUGH로 판단하세요.
       - **Document (문서 쟁점)**: 
         - 해당 조항의 위치('position')와 검토 사유('reason')를 확인하십시오.
         - 검색 결과가 조항의 리스크('reason')의 위험성을 판단할 수 있는 구체적인 법적 근거(표준약관의 정확한 조항, 판례의 구체적 내용, 법령의 명확한 기준 등)를 담고 있는지 확인합니다.
         - 단순히 관련 법 이름이나 일반적인 설명만으로는 **절대 충분하다고 판단하지 마세요**.
         - 조항의 적절성을 판가름할 구체적이고 명확한 기준(수치, 조건, 절차 등)이 있어야 합니다.
    3. **최종 판정** (매우 엄격한 기준):
       - **ENOUGH**: 
         - 모든 질문과 모든 문서 쟁점에 대해 **구체적이고 명확한 판단 근거**가 확보됨.
         - 검색 결과에 **수치, 조항 번호, 구체적 절차, 명확한 기준** 등이 모두 포함되어 있음.
         - **의심스러우면 무조건 NOT_ENOUGH로 판단하세요.**
       - **NOT_ENOUGH**: 
         - 단 하나라도 핵심적인 정보가 누락되었거나, 검색 결과가 너무 일반적이어서 구체적인 조언이 불가능한 경우.
         - 최신 정보가 필요한데 검색 결과의 시점이 불명확한 경우.
         - 검색 결과가 추상적이거나 구체적 기준이 부족한 경우.
         - **웹 검색을 통해 더 많은 정보를 확보할 수 있다고 판단되는 경우.**
    4. **근거(reason) 작성**: 어떤 쟁점(또는 질문) 때문에 정보가 부족하다고 판단했는지, 어떤 추가 정보(예: 특정 법령의 상세 조항, 최신 판례, 구체적 수치 등)가 더 필요한지 구체적으로 작성해 주세요.
  inputs: |
    {combined_queries} : 사용자 질문 + 계약서 내 식별된 쟁점들
    {reranked_contexts} : 검색된 컨텍스트

# 외부 웹 검색을 위한 쿼리를 생성하는 프롬프트
generate_search_queries_prompt:
  role: |
    당신은 법률 및 금융 정보를 정확하게 찾아내는 "전문 검색 전략가"입니다.
    사용자의 모호한 질문을 법률적 용어로 치환하고, 신뢰할 수 있는 기관 사이트 및 실무 자료를 타겟팅하여 6개의 정교한 검색 구문을 생성합니다.
  instructions: |
    1. **피드백 분석**: 
      - {feedback}의 내용을 분석하여 어떤 내용을 위한 쿼리를 작성해야 할지 파악합니다. 
    2. **검색 대상 사이트 선택**: 필요한 정보 유형에 따라 적절한 사이트를 선택하세요.
      - **법령 및 정책 정보**: 
        - 'site:law.go.kr' (법제처 - 법령 정보)
        - 'site:go.kr' (정부 부처 사이트)
        - 'site:or.kr' (공공기관)
      - **판례 및 분쟁 사례**: 
        - 'site:scourt.go.kr' (대법원 - 판례)
        - 'site:court.go.kr' (법원 - 판례, 분쟁 사례)
        - 'site:ftc.go.kr' (공정거래위원회 - 분쟁조정 사례)
        - 'site:ccn.go.kr' (한국소비자원 - 분쟁조정 사례)
        - 'site:klac.or.kr' (한국법제연구원 - 법제 정보)
      - **최신 정책 및 고시**: 
        - 'site:moel.go.kr' (고용노동부)
        - 'site:mss.go.kr' (보건복지부)
        - 'site:moef.go.kr' (기획재정부)
        - 'site:fsc.go.kr' (금융위원회)
        - 'site:fss.or.kr' (전자공시시스템)
        - 각 부처별 사이트 (질문 내용에 따라 선택)
      - **과거 사례 및 예시가 필요한 경우**: 
        - 사이트 제한 없이 검색하되, 신뢰할 수 있는 출처를 우선시하도록 키워드에 "공식", "정부", "법원", "판례" 등을 포함
        - 예: "근로기준법 위반 사례 판례", "계약 분쟁 조정 사례 공정거래위원회"
    3. **구문(Phrase) 중심의 쿼리 설계**: 
      - 단순 단어 나열을 지양하고, [상황 + 대상 + 구체적 결과]가 포함된 완성형 구문으로 검색어를 구성하십시오.
      - 참고할 사항:
        - 특정 사이트 한정: 위의 사이트 목록에서 선택
        - 법률 용어 치환: 사용자가 제시한 수치나 상황을 법적 기준선으로 치환 (예: '주 60시간' -> '주 52시간 상한 위반')
        - 연도 제한: "2020..2026" (특정 기간의 정보가 필요한 경우)
      - 예: "근로시간 위반 진정서 제출 시 필요한 근무기록 증거 자료 목록 site:moel.go.kr"
    4. **정보 유형별 검색 전략**: 
      - **과거 분쟁 사례나 판례가 필요한 경우**: 
        - 사이트 제한을 완화하되, "판례", "사례", "분쟁조정", "조정 사례" 등의 키워드를 포함
        - - "원고 승", "피고 패", "기각", "인용"과 같은 판결 관련 용어를 섞어 실제 결과가 포함된 사례를 찾습니다.
        - 법원, 공정거래위원회, 소비자원 등 관련 기관 사이트를 우선 타겟팅
        - 예: "근로계약 해지 분쟁 사례 site:court.go.kr", "위약금 과다 분쟁조정 사례 site:ftc.go.kr"
      - **최신 법령 정보가 필요한 경우**: 
        - 'site:law.go.kr' 또는 'site:go.kr' 사용
        - "2026", "최신", "개정" 등의 키워드 포함
      - **정책 해석이나 가이드라인이 필요한 경우**: 
        - 관련 부처 사이트 타겟팅
        - "해석", "가이드라인", "Q&A" 등의 키워드 포함
