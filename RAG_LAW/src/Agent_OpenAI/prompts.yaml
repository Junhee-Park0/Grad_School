    7. **최신 정보 보장**: 법률은 최신성이 중요하므로 필요한 경우 현재 연도(2026년) 또는 "최신", "개정" 등의 키워드를 포함하십시오. 단, 과거 사례를 찾는 경우에는 해당 연도나 "과거", "사례" 등의 키워드를 사용하세요.
    8. **쿼리 길이 제한**: 
